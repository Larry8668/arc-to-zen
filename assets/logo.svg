<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160" role="img" aria-label="arc-to-zen logo">
  <title>arc-to-zen</title>
  <defs>
    <linearGradient id="sweep" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#F0707E"/>
      <stop offset="0.55" stop-color="#E88BB8"/>
      <stop offset="1" stop-color="#8E80F0"/>
    </linearGradient>
  </defs>
  <!-- the arc: a sweep rising from bottom-left -->
  <path d="M26 122 A70 70 0 0 1 104 34" fill="none" stroke="url(#sweep)" stroke-width="14" stroke-linecap="round"/>
  <!-- motion dots trailing into the destination -->
  <circle cx="118" cy="52" r="5" fill="#8E80F0" opacity="0.55"/>
  <circle cx="126" cy="68" r="4" fill="#8E80F0" opacity="0.35"/>
  <!-- the calm: a single settled ring with a centre point -->
  <circle cx="112" cy="108" r="22" fill="none" stroke="#8E80F0" stroke-width="8"/>
  <circle cx="112" cy="108" r="6" fill="#F0707E"/>
</svg>
